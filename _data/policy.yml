languages: ["en"]
  title: "Privacy Policy for %1$s"
  last_updated_label: "Last updated: %1$s"
  last_updated_date: "July 28, 2026"
  blocks:
    - type: section_title
      text: "1. Introduction"
    - type: paragraph
      text: "%1$s is an Android application developed and published by CarlosSalaDev."
    - type: paragraph
      text: "This Privacy Policy explains how %1$s accesses, stores, collects, uses, and transfers information when you use the application. It also describes how Google Firebase, Android system features, backup services, external applications, and support communications may process information related to %1$s."
    - type: paragraph
      text: "%1$s does not require registration, does not create user accounts, and does not operate its own remote server or proprietary cloud synchronization service."

    - type: section_title
      text: "2. Information Stored on Your Device"
    - type: paragraph
      text: "%1$s stores certain information locally so that its features can operate."
    - type: paragraph
      text: "This information may include:"
    - type: bullet_list
      items:
        - "Notes created, edited, or saved by you."
        - "Predefined Actions parameters, such as phone numbers, email addresses, message content, web addresses, and text prepared for sharing."
        - "Application preferences, including the selected light or dark theme."
        - "Other locally stored settings required to preserve the application's configuration."
    - type: paragraph
      text: "This information is stored in %1$s's private application storage."
    - type: paragraph
      text: "%1$s does not intentionally send the contents of your notes or Predefined Actions parameters to CarlosSalaDev or Firebase. However, this information may leave the device when:"
    - type: bullet_list
      items:
        - "You intentionally execute a Predefined Action."
        - "You send information through an external application."
        - "Android performs a backup or device transfer, as described below."

    - type: section_title
      text: "3. Information Accessed or Displayed by %1$s"
    - type: paragraph
      text: "The System Information section displays technical information provided by Android, such as the device manufacturer, model, Android version, and other system information."
    - type: paragraph
      text: "%1$s displays this information for your reference and does not intentionally upload the complete contents of the System Information screen to a server operated by CarlosSalaDev."
    - type: paragraph
      text: "%1$s does not request access to GPS or precise location, and it does not request permission to access:"
    - type: bullet_list
      items:
        - "Your contacts."
        - "Your call history."
        - "Received SMS messages."
        - "Your email inbox."
        - "Your browsing history."
        - "Your precise geographic location."
    - type: paragraph
      text: "Google Firebase may separately process certain device, application, network, and approximate-location information for analytics and diagnostic purposes, as explained in this Policy."

    - type: section_title
      text: "4. Information Collected Automatically"
    - type: paragraph
      text: "%1$s uses Firebase services provided by Google. Depending on the Firebase service and the configuration available on the device, these services may automatically process the following categories of information:"
    - type: bullet_list
      items:
        - "App activity and interactions, such as app launches, sessions, general engagement, automatically collected events, and actions occurring immediately before a crash."
        - "Approximate location, such as country, region, or city information derived from network data."
        - "Device and application information, such as manufacturer, model, operating-system version, application version, language, screen characteristics, and network connection type."
        - "Device or other identifiers, such as Firebase Installation ID, Crashlytics installation identifiers, app-instance identifiers, the Android Advertising ID when available, and installation-attribution information."
        - "Crash logs, including stack traces and relevant information about the application's state when a crash occurs."
        - "Diagnostic information, such as session information, device metadata, and technical circumstances related to stability problems."
    - type: paragraph
      text: "Google Analytics collects approximate location, device information, user counts, and session statistics through its default implementation. Approximate location may be derived from network information such as an IP address; %1$s does not obtain GPS coordinates through Analytics."
    - type: paragraph
      text: "%1$s does not intentionally send the text of your notes, saved messages, configured phone numbers, email content, or other Predefined Actions parameters to Firebase as custom Analytics events, user identifiers, Crashlytics custom keys, or custom logs."

    - type: section_title
      text: "5. How Automatically Collected Information Is Used"
    - type: paragraph
      text: "Automatically collected technical information is used to:"
    - type: bullet_list
      items:
        - "Understand the general use of %1$s."
        - "Measure application launches, sessions, engagement, and usage trends."
        - "Identify crashes and stability problems."
        - "Investigate the technical circumstances surrounding a crash."
        - "Improve the reliability, performance, usability, and future development of %1$s."
        - "Measure application installation and attribution statistics."
        - "Provide and maintain the Firebase services used by %1$s."
    - type: paragraph
      text: "Firebase states that the end-user information described in its Android data-disclosure documentation is encrypted in transit using HTTPS."

    - type: section_title
      text: "6. Firebase Services"
    - type: paragraph
      text: "%1$s currently uses the Firebase services described below."
    - type: subsection_title
      text: "6.1 Google Analytics for Firebase"
    - type: paragraph
      text: "Google Analytics helps CarlosSalaDev understand the general use of the application, including launches, sessions, engagement, approximate geographic distribution, device categories, and installation trends."
    - type: paragraph
      text: "Analytics collection is enabled by default in the current version of %1$s. %1$s does not currently provide an in-app control for disabling Analytics collection."
    - type: paragraph
      text: "%1$s does not intentionally create custom Analytics events containing notes, messages, email addresses, phone numbers, or other content entered in Predefined Actions."
    - type: subsection_title
      text: "6.2 Firebase Crashlytics"
    - type: paragraph
      text: "Firebase Crashlytics helps identify and diagnose crashes affecting %1$s."
    - type: paragraph
      text: "Crashlytics automatically collects information such as:"
    - type: bullet_list
      items:
        - "Stack traces when the application crashes."
        - "Relevant application state at the time of the crash."
        - "Relevant device metadata."
        - "A Crashlytics installation identifier."
        - "Session and quality information provided through related Firebase services."
        - "Analytics events used as breadcrumbs to describe actions occurring immediately before a crash."
    - type: paragraph
      text: "%1$s does not intentionally attach notes, Predefined Actions content, phone numbers, email addresses, or free-text user identifiers to Crashlytics reports."
    - type: paragraph
      text: "Firebase distinguishes between information automatically collected by Crashlytics and custom keys, logs, identifiers, and non-fatal events that a developer may optionally add."
    - type: paragraph
      text: "Crashlytics collection is enabled by default in the current version of %1$s. %1$s does not currently provide an in-app control for disabling Crashlytics collection."
    - type: subsection_title
      text: "6.3 Firebase Installations"
    - type: paragraph
      text: "Firebase Installations generates and collects a Firebase Installation ID associated with an individual installation of %1$s."
    - type: paragraph
      text: "According to Firebase, this identifier identifies an installation of the application and is not intended to uniquely identify an individual or a physical device."
    - type: subsection_title
      text: "6.4 Firebase Sessions and Data Transport"
    - type: paragraph
      text: "Firebase Sessions may process application metadata, device metadata, network connection information, and usage information, such as when the application enters the foreground and begins a new session."
    - type: paragraph
      text: "Google Data Transport supports the secure delivery to Firebase of Analytics, Crashlytics, and other related technical information."

    - type: section_title
      text: "7. Advertising ID and Advertising"
    - type: paragraph
      text: "%1$s does not display advertisements."
    - type: paragraph
      text: "Google Analytics may access the Android Advertising ID and advertising-attribution services when they are available on the device. These may be used for:"
    - type: bullet_list
      items:
        - "Analytics."
        - "Measurement."
        - "Installation attribution."
        - "Understanding general installation and usage trends."
    - type: paragraph
      text: "CarlosSalaDev does not use the Advertising ID to display advertisements inside %1$s."
    - type: paragraph
      text: "The availability and behavior of the Advertising ID may depend on the Android version, Google Play services, device settings, and privacy controls selected by the user."

    - type: section_title
      text: "8. Phone Permission"
    - type: paragraph
      text: "%1$s requests the Android CALL_PHONE permission only when you use Call Number and direct calling requires that permission."
    - type: paragraph
      text: "If you deny the permission, %1$s will not initiate the direct call. Instead, you may use Dial Number, which opens the configured number in a compatible phone application so that you can review it and initiate the call manually."
    - type: paragraph
      text: "%1$s does not use the phone permission to:"
    - type: bullet_list
      items:
        - "Access your contacts."
        - "Read your call history."
        - "Record telephone conversations."
        - "Monitor calls."
        - "Initiate calls without an action performed by you."
    - type: paragraph
      text: "The configured phone number remains stored locally unless it is included in an Android backup or intentionally passed to the phone application when you execute the action."

    - type: section_title
      text: "9. Predefined Actions and External Applications"
    - type: paragraph
      text: "%1$s includes the following Predefined Actions:"
    - type: bullet_list
      items:
        - "Send Email."
        - "Send SMS."
        - "Open Browser."
        - "Call Number."
        - "Dial Number."
        - "Share Text."
    - type: paragraph
      text: "When you execute one of these actions, %1$s may pass the configured information to the corresponding Android component or a compatible external application."
    - type: paragraph
      text: "For example, %1$s may pass:"
    - type: bullet_list
      items:
        - "A recipient, subject, and message to an email application."
        - "A phone number and message to an SMS application."
        - "A web address to a browser."
        - "A phone number to a phone or dialer application."
        - "Saved text to an application selected through Android's sharing interface."
    - type: paragraph
      text: "These transfers occur only after you intentionally execute the corresponding action."
    - type: paragraph
      text: "%1$s does not automatically read information subsequently created, received, or stored by those external applications."
    - type: paragraph
      text: "After information is passed to an external application, its subsequent processing is governed by that application and its provider. CarlosSalaDev does not control the privacy, security, transmission, retention, or later use of information by independent third-party applications."
    - type: paragraph
      text: "You should review an external application's privacy practices before sending sensitive information through it."

    - type: section_title
      text: "10. Android Backups and Device Transfers"
    - type: paragraph
      text: "%1$s allows Android backup and device-transfer features."
    - type: paragraph
      text: "Depending on your Android version, device manufacturer, Google Account settings, backup provider, and personal preferences, Android may back up or transfer eligible %1$s data, including:"
    - type: bullet_list
      items:
        - "Notes."
        - "Predefined Actions parameters."
        - "Application preferences."
        - "Locally stored configuration files."
        - "Application databases."
    - type: paragraph
      text: "Android Auto Backup may include eligible private application files, preferences, and databases unless they have been specifically excluded. Restored data may reappear after reinstalling %1$s or configuring another device."
    - type: paragraph
      text: "These backups and transfers are managed by Android, Google, the relevant manufacturer, or the backup provider. CarlosSalaDev does not directly receive, inspect, or control the contents of your Android backups."
    - type: paragraph
      text: "Uninstalling %1$s from a device may not delete a backup already maintained by Android or another provider."

    - type: section_title
      text: "11. Support Communications"
    - type: paragraph
      text: "If you contact CarlosSalaDev using the support email address, the following information may be received:"
    - type: bullet_list
      items:
        - "Your email address."
        - "Your name, if it appears in your email account or message."
        - "The contents of your message."
        - "Screenshots, files, or other information you voluntarily attach."
        - "Technical information you choose to provide about your device or the problem encountered."
    - type: paragraph
      text: "This information may be used to:"
    - type: bullet_list
      items:
        - "Respond to your request."
        - "Provide assistance."
        - "Investigate reported errors."
        - "Review feedback or feature suggestions."
        - "Maintain reasonable records of support communications."
    - type: paragraph
      text: "%1$s does not automatically send support emails, notes, Predefined Actions parameters, diagnostic files, or other personal content to CarlosSalaDev. You decide whether to send a message and what information to include."
    - type: paragraph
      text: "Do not send passwords, payment-card information, authentication codes, or other highly sensitive information through the support email."

    - type: section_title
      text: "12. Data Processing, Transfers, and Service Providers"
    - type: paragraph
      text: "CarlosSalaDev does not sell personal information collected through %1$s."
    - type: paragraph
      text: "Google and Firebase process technical information as service providers for Analytics, Crashlytics, installation identification, session measurement, attribution, and data transport."
    - type: paragraph
      text: "Firebase states that it does not transfer the information described in its Android disclosure documentation to third parties, except to subprocessors that assist in providing Firebase services or according to integrations and instructions enabled by the developer."
    - type: paragraph
      text: "Information may also be transferred:"
    - type: bullet_list
      items:
        - "To an external application when you intentionally execute a Predefined Action."
        - "Through Android backup or device-transfer services, according to your settings."
        - "To your email provider and CarlosSalaDev when you voluntarily contact support."
        - "When necessary to comply with applicable law, legal process, or a valid governmental request."
        - "When reasonably necessary to protect legal rights, security, the integrity of %1$s, or the safety of other persons."
    - type: paragraph
      text: "%1$s does not use an independent backend operated by CarlosSalaDev to receive notes, Predefined Actions content, or other locally stored user content."

    - type: section_title
      text: "13. Data Retention and Deletion"
    - type: subsection_title
      text: "13.1 Locally Stored Data"
    - type: paragraph
      text: "Notes, preferences, and Predefined Actions parameters generally remain on the device until you:"
    - type: bullet_list
      items:
        - "Edit or delete them within %1$s."
        - "Clear %1$s's storage through Android settings."
        - "Uninstall %1$s."
    - type: paragraph
      text: "Locally deleted data may later reappear if Android restores it from an existing backup."
    - type: subsection_title
      text: "13.2 Firebase Technical Data"
    - type: paragraph
      text: "Analytics, Crashlytics, installation, session, and diagnostic information is retained according to the applicable Firebase and Google Analytics project settings and Google's retention and deletion practices."
    - type: paragraph
      text: "Retention periods may vary depending on the Firebase service, the type of information, and the configuration of the associated Firebase or Google Analytics project."
    - type: paragraph
      text: "CarlosSalaDev does not maintain a %1$s account that directly links Firebase technical records to your name, email address, or a %1$s user profile."
    - type: paragraph
      text: "%1$s does not provide an account-deletion function because the application does not create user accounts."
    - type: subsection_title
      text: "13.3 Support Communications"
    - type: paragraph
      text: "Support emails may be retained for as long as reasonably necessary to:"
    - type: bullet_list
      items:
        - "Respond to your request."
        - "Investigate a reported problem."
        - "Maintain support records."
        - "Protect legal rights."
        - "Comply with applicable obligations."
    - type: paragraph
      text: "You may contact CarlosSalaDev if you have questions about information you voluntarily provided through support."

    - type: section_title
      text: "14. Data Security"
    - type: paragraph
      text: "CarlosSalaDev relies on security measures provided by Android, Google, and Firebase to reduce the risk of unauthorized access, alteration, disclosure, or loss."
    - type: paragraph
      text: "These measures include:"
    - type: bullet_list
      items:
        - "Android private application storage for locally stored information."
        - "Android permission controls for direct phone calls."
        - "Encrypted HTTPS transmission for Firebase data."
        - "Access controls maintained by Firebase and Google."
        - "Backup protections administered by Android and the selected backup provider."
    - type: paragraph
      text: "Firebase states that the end-user information described in its Android data-disclosure documentation is encrypted in transit using HTTPS."
    - type: paragraph
      text: "No method of storage or transmission can be guaranteed to be completely secure. You should avoid storing highly sensitive information in Notes or Predefined Actions unless you understand the risks related to device access, backups, sharing, and external applications."

    - type: section_title
      text: "15. Children's Privacy"
    - type: paragraph
      text: "%1$s is intended for users aged 18 and over and is not designed or specifically directed to children."
    - type: paragraph
      text: "The application does not provide:"
    - type: bullet_list
      items:
        - "User accounts or profiles."
        - "Social interaction between users."
        - "Forms requesting a child's name, address, email address, or other identifying information."
        - "Advertising directed at children."
    - type: paragraph
      text: "If you believe that a child has voluntarily sent personal information to the support email, contact CarlosSalaDev so that the communication can be reviewed and appropriate action considered."

    - type: section_title
      text: "16. Your Choices"
    - type: paragraph
      text: "You can control certain information and features by:"
    - type: bullet_list
      items:
        - "Choosing what content to save in Notes and Predefined Actions."
        - "Editing or deleting locally stored content."
        - "Denying the CALL_PHONE permission and using Dial Number instead."
        - "Deciding whether to complete or cancel an action after an external application opens."
        - "Clearing %1$s's storage through Android settings."
        - "Uninstalling %1$s."
        - "Managing Android backup and device-transfer preferences."
        - "Managing the Advertising ID and other privacy controls provided by Android and Google."
        - "Deciding whether to contact support and what information to include."
    - type: paragraph
      text: "The current version of %1$s does not include:"
    - type: bullet_list
      items:
        - "A %1$s account."
        - "An account-deletion process."
        - "A proprietary cloud synchronization service."
        - "An in-app control for disabling Firebase Analytics."
        - "An in-app control for disabling Firebase Crashlytics."

    - type: section_title
      text: "17. Third-Party Services and Policies"
    - type: paragraph
      text: "Google, Firebase, Android, external applications, email providers, device manufacturers, and backup providers may process information under their own terms and privacy policies."
    - type: paragraph
      text: "This Privacy Policy describes the practices of %1$s and CarlosSalaDev. It does not replace or control the privacy policies of independent third-party services."

    - type: section_title
      text: "18. Changes to This Privacy Policy"
    - type: paragraph
      text: "This Privacy Policy may be updated when %1$s's features, permissions, service providers, data practices, or legal obligations change."
    - type: paragraph
      text: "The revised Policy will be published with an updated Last updated date."
    - type: paragraph
      text: "Users should review this Policy periodically, especially after installing a significant %1$s update."
    - type: paragraph
      text: "Sections may be added, removed, or expanded as %1$s evolves. This Policy will describe the features and data practices of the currently published application and will not describe features that have not yet been implemented."

    - type: section_title
      text: "19. Contact"
    - type: paragraph
      text: "For privacy questions, support requests, error reports, or feedback, contact:"
    - type: paragraph
      text: "Developer: CarlosSalaDev"
    - type: paragraph
      text: "Application: %1$s"
    - type: email_link
      label: "Email"
      email: "carlossala.apps@gmail.com"
